name: "🚀 Kotlin Toolchain Debug APK Build"

on:
  workflow_dispatch:

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  build-debug:
    name: "Build & Artifact"
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout Code
        uses: actions/checkout@v7

      - name: 🔧 Make kotlin wrapper executable
        run: chmod +x ./kotlin

      - name: 🗄️ Cache Kotlin CLI & Gradle Caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: kt-gradle-${{ runner.os }}-${{ hashFiles('kotlin', '**/*.yaml*') }}
          restore-keys: |
            kt-gradle-${{ runner.os }}-

      - name: 🔨 Build Debug APK
        run: ./kotlin --log-level=info build --platform=android -v debug

      - name: 🔎 Inspect Cache Locations
        run: |
          echo "=== مسار ملفات Gradle 9.5.0 على نظام الـ Runner ==="
          find ~ -name "*gradle-9.5.0*" 2>/dev/null
          echo "=================================================="
          echo "=== محتويات كاش Kotlin Toolchain ==="
          ls -la ~/.cache/JetBrains/Kotlin/ 2>/dev/null || true

      - name: 🔍 Locate & bridge APK to conventional Gradle path
        id: find_apk
        run: |
          REAL_APK=$(find . -iname "*.apk" | head -n 1)
          if [ -z "$REAL_APK" ]; then
            echo "لم يتم العثور على APK، راجع سجل خطوة البناء أعلاه."
            exit 1
          fi
          echo "Found: $REAL_APK"
          mkdir -p build/outputs/apk/debug
          cp "$REAL_APK" build/outputs/apk/debug/app-debug.apk
          echo "apk_path=build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: 📦 Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
